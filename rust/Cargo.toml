[package]
name = "host-pressure"
version = "0.1.5"
edition = "2021"
description = "Read CPU, memory, swap, disk, thermal, battery and pressure stall time on macOS, Linux and Windows, and turn them into one verdict: ok, busy or overloaded. No subprocess."
license = "MIT"

[[bin]]
name = "host-pressure"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
