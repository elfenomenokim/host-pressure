[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "host-pressure"
version = "0.1.1"
description = "A command-line resource check that tells you whether your machine has room for another job."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "El Fenomeno" }]
keywords = [
  "cpu",
  "memory",
  "swap",
  "pressure",
  "psi",
  "load",
  "monitoring",
  "health-check",
  "cli",
  "macos",
  "linux",
  "windows",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/elfenomenokim/host-pressure"
Repository = "https://github.com/elfenomenokim/host-pressure"
Issues = "https://github.com/elfenomenokim/host-pressure/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "host_pressure"
strip = true
