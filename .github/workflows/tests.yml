name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest (26.04) ships no 3.9 build; keep 3.9 on ubuntu-22.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test Rust edition
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml
          cargo test --locked --manifest-path rust/Cargo.toml
      - name: Test Python edition
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests
      - name: Check Python/Rust parity
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # rust/parity.sh uses Unix diff and /tmp + / mount paths, so parity is skipped on Windows;
          # physical-host battery and thermal sensors are also left out of CI.
          bash rust/parity.sh
